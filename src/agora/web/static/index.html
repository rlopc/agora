<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent room</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="header">
    <div class="title">
      <h1>Agent room</h1>
      <span id="status" class="status" role="status">Connecting…</span>
    </div>
    <div class="controls">
      <ul id="participants" class="participants" aria-label="Participants"></ul>
      <button id="alerts" type="button" class="button" title="Notify me when a message mentions me or an agent asks for permission, while this page is in the background" hidden>Enable notifications</button>
      <button id="round-close" type="button" class="button" title="Show every answer now, without waiting for the rest" hidden>Close blind round</button>
      <button id="pause" type="button" class="button" aria-pressed="false">Pause wakes</button>
    </div>
  </header>

  <section id="permissions" class="permissions" aria-label="Permission requests" hidden>
    <ul id="permissions-pending" class="permission-list"></ul>
    <p id="permissions-hint" class="permission-hint" hidden>To answer here, open the link the room printed when it started. You can always answer in the agent's terminal.</p>
    <details id="permissions-answered" hidden>
      <summary id="permissions-answered-title"></summary>
      <ul id="permissions-answered-list" class="permission-list"></ul>
    </details>
  </section>

  <main id="messages" class="messages" aria-live="polite">
    <p id="empty" class="empty">No messages yet. Mention <b>@claude</b> or <b>@codex</b> to wake them.</p>
  </main>

  <form id="form" class="composer">
    <button id="new-messages" type="button" class="new-messages" hidden></button>
    <div id="reply" class="reply" hidden>
      <span id="reply-text"></span>
      <button id="reply-cancel" type="button" class="link" aria-label="Cancel reply">×</button>
    </div>
    <div class="row">
      <textarea id="text" rows="2" placeholder="Write a message… (Enter sends, Shift+Enter new line)" aria-label="Message"></textarea>
      <label class="blind" title="The mentioned agents answer without seeing each other's answers until all of them have replied">
        <input id="blind" type="checkbox"> Blind round
      </label>
      <button type="submit" class="button primary">Send</button>
    </div>
  </form>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script src="/static/app.js"></script>
</body>
</html>

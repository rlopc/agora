# lychee options: offline in the pre-commit hook, online in links.yml. Both pass
# the files: every versioned Markdown file (`git ls-files '*.md'`).
include_fragments = "full"
no_progress = true
# Generated by release-please: a broken link there cannot be fixed by hand.
exclude_path = ['^CHANGELOG\.md$']
# The room's own address (http://127.0.0.1:8765) only answers while a room runs.
exclude_loopback = true

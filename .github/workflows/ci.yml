# Runs the commit hooks, a secret scan of the history and the tests on each pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The supported platforms: macOS and Linux.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # mise.lock is format 4, which needs it (min_version in mise.toml).
          version: 2026.11.5
          install: false

      - run: mise install --locked
        env:
          # Read-only; avoids GitHub API rate limits on shared runners.
          GITHUB_TOKEN: ${{ github.token }}

      - run: mise exec -- uv sync --locked
      # Every commit hook, also when a commit skipped them (lint-imports and pyright among them).
      - run: mise exec -- uv run --locked pre-commit run --all-files --show-diff-on-failure
      # The pre-commit hook scans only staged changes.
      - run: mise exec -- gitleaks git --redact --no-banner
      - run: mise exec -- uv run --locked pytest --cov

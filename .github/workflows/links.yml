# Weekly check of external links: the same lychee (mise.lock), options
# (lychee.toml) and files as the pre-commit hook, which checks offline.
# On failure it opens an issue, or comments on the one already open.
name: Links

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only mise itself, as in ci.yml; then only the tool this job uses.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # mise.lock is format 4, which needs it (min_version in mise.toml).
          version: 2026.11.5
          install: false
          # Its default key is not documented: a cache with only this tool
          # must not be restored in ci.yml.
          cache: false
      - run: mise install --locked lychee
        env:
          # Read-only; avoids GitHub API rate limits on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
      # A broken link does not fail the job: the next step reports it.
      - id: lychee
        env:
          # lychee uses it for github.com links, to avoid rate limits.
          GITHUB_TOKEN: ${{ github.token }}
          # Install nothing else of mise.toml.
          MISE_EXEC_AUTO_INSTALL: "false"
        run: |
          mkdir -p lychee
          status=0
          git ls-files '*.md' | mise exec -- lychee --files-from - --format markdown --output lychee/report.md || status=$?
          cat lychee/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Broken external links
        run: |
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file lychee/report.md
          else
            gh issue create --title "$TITLE" --body-file lychee/report.md
          fi

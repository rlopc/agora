# Version updates, a week after each release (the same cooldown as uv and mise).
# Titles are `build(deps): …`, which the PR title check accepts.
# Minor and patch updates come in one pull request per ecosystem; each major update in its own.
# mise.toml is not supported: see .github/workflows/tool-updates.yml.
# pre-commit is not listed: every hook is local, with its version in a lockfile.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Its bounds follow uv's version in mise.toml, so uv runs its built-in backend.
      - dependency-name: uv-build
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every step of github/codeql-action must run the same version, majors
      # and security updates included. A dependency joins the first group it
      # matches, and a group without applies-to covers version updates only.
      codeql-action:
        patterns: ["github/codeql-action*"]
      codeql-action-security:
        applies-to: security-updates
        patterns: ["github/codeql-action*"]
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)

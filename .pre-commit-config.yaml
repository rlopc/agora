# Every hook is local and runs a tool locked by uv.lock or mise.lock, through
# `mise exec` so it works even where mise is not activated (IDEs, git GUIs).
minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # From pre-commit-hooks (uv.lock), with the entries of its own hook definitions.
      - id: check-added-large-files
        name: check for added large files
        entry: mise exec -- uv run --locked check-added-large-files --enforce-all
        language: unsupported
        exclude: ^(uv|mise)\.lock$

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: mise exec -- uv run --locked check-merge-conflict --assume-in-merge
        language: unsupported
        types: [text]

      - id: check-toml
        name: check toml
        entry: mise exec -- uv run --locked check-toml
        language: unsupported
        types: [toml]

      - id: end-of-file-fixer
        name: fix end of files
        entry: mise exec -- uv run --locked end-of-file-fixer
        language: unsupported
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: mise exec -- uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]

      # Secrets never go into the repository.
      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --no-banner
        language: unsupported
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$

      # --offline: local checks never use the network.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --offline --no-progress
        language: unsupported
        files: ^(\.github/workflows/[^/]+\.ya?ml|\.pre-commit-config\.yaml)$
        require_serial: true

      # The project's checks, as in CI. They look at the whole project, not the staged files.
      - id: lint-imports
        name: import layers
        entry: mise exec -- uv run --locked lint-imports
        language: unsupported
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: mise exec -- uv run --locked pyright
        language: unsupported
        types: [python]
        pass_filenames: false

      # Slower: only before pushing.
      - id: pytest
        name: pytest
        entry: mise exec -- uv run --locked pytest -q
        language: unsupported
        types: [python]
        pass_filenames: false
        stages: [pre-push]

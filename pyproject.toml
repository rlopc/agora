[project]
name = "agora"
version = "0.2.1"
description = "Local room where a user coordinates AI coding agents"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28",
    "mcp>=2.3",
    "tomlkit>=0.15.2",
    "uvicorn>=0.54",
]

[project.scripts]
agora = "agora.server:main"
agora-mcp = "agora.mcp.server:main"
agora-prepare = "agora.cli:main_prepare"
agora-launch = "agora.cli:main_launch"
agora-start = "agora.cli:main_start"
agora-archive = "agora.cli:main_archive"
agora-watch = "agora.agents.watch:main_watch"
agora-pending = "agora.agents.watch:main_pending"
agora-permission = "agora.agents.permission:main_permission"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "import-linter>=2.16",
    "pyright[nodejs]>=1.1.414",
    "pre-commit>=4.7",
    "pre-commit-hooks>=6.0",
    "ruff>=0.17.4",
    "codespell>=2.4.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Skip versions published less than 7 days ago (supply-chain protection), as mise.toml does.
exclude-newer = "7 days"

[tool.ruff]
# The line length the code was written with.
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    # Left to the formatter.
    "E501",
    # Flags every subprocess call; commands are built as lists, never through a shell.
    "S603",
    # urlopen only reaches the room's own URL, from agora.toml or --url.
    "S310",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert, and the fake tokens of the tests

[tool.codespell]
# Hidden files are tracked too (.github/, .pre-commit-config.yaml); without this,
# codespell skips them even when pre-commit passes them by name.
check-hidden = true
# Lockfiles and the changelog are generated; the rest are untracked: caches, local data and notes.
skip = "uv.lock,mise.lock,.mise/locks/*,./.mise/locks,CHANGELOG.md,./.git,./.venv,./.pytest_cache,./.ruff_cache,./.import_linter_cache,./data,./sample,*.local.*"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# A warning is a failure: Python reports unclosed resources, such as database connections, only as warnings.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agora"]
branch = true
# The tests run the commands (agora-watch, agora-pending…) as subprocesses.
patch = ["subprocess"]
# Saves the data of a command the tests stop with SIGTERM (agora-watch runs until stopped).
sigterm = true

[tool.coverage.report]
# The level reached, rounded down: raise it as coverage grows.
fail_under = 94
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "agora"

[[tool.importlinter.contracts]]
name = "Composition depends on tools, tools on agents, agents on core"
type = "layers"
layers = [
    "agora.cli | agora.server",
    "agora.tools",
    "agora.agents",
    "agora.core",
]

[[tool.importlinter.contracts]]
name = "Tools are independent of each other"
type = "independence"
modules = ["agora.tools.antigravity", "agora.tools.claude", "agora.tools.codex"]

[[tool.importlinter.contracts]]
name = "Store, web and MCP depend only on core"
type = "forbidden"
source_modules = ["agora.store", "agora.web", "agora.mcp"]
forbidden_modules = ["agora.agents", "agora.tools", "agora.server", "agora.cli"]

[tool.pyright]
# Tests are not checked: they narrow types by hand and use test doubles.
include = ["src"]
